<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">PCA - Dimensionality Reduction</text>
  <g fill="#dbeafe" stroke="#2563eb" opacity="0.7">
    <circle cx="180" cy="200" r="5"/><circle cx="200" cy="170" r="5"/><circle cx="220" cy="210" r="5"/>
    <circle cx="240" cy="180" r="5"/><circle cx="260" cy="220" r="5"/><circle cx="280" cy="160" r="5"/>
    <circle cx="300" cy="200" r="5"/><circle cx="190" cy="230" r="5"/><circle cx="250" cy="150" r="5"/>
  </g>
  <line x1="160" y1="240" x2="340" y2="130" stroke="#dc2626" stroke-width="3"/>
  <text x="350" y="125" font-size="12" fill="#dc2626" font-weight="600">PC1 (max variance)</text>
  <line x1="280" y1="250" x2="320" y2="140" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="155" font-size="12" fill="#2563eb">PC2</text>
  <rect x="400" y="140" width="200" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="420" y="165" font-size="12" fill="#334155">Original: n features</text>
  <text x="420" y="190" font-size="12" fill="#334155">Reduced: k components</text>
  <text x="420" y="215" font-size="12" fill="#334155">Preserves max variance</text>
  <text x="420" y="240" font-size="12" fill="#334155">Uncorrelated axes</text>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#475569">sklearn.decomposition.PCA(n_components=k)</text>
</svg>
