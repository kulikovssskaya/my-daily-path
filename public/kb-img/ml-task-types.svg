<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ML Task Types</text>
  <rect x="40" y="60" width="170" height="120" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Classification</text>
  <text x="60" y="115" font-size="11" fill="#334155">discrete labels</text>
  <text x="60" y="135" font-size="11" fill="#334155">spam / not spam</text>
  <text x="60" y="155" font-size="11" fill="#334155">metrics: accuracy, F1</text>
  <rect x="235" y="60" width="170" height="120" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Regression</text>
  <text x="255" y="115" font-size="11" fill="#334155">continuous values</text>
  <text x="255" y="135" font-size="11" fill="#334155">house price</text>
  <text x="255" y="155" font-size="11" fill="#334155">metrics: MAE, R2</text>
  <rect x="430" y="60" width="170" height="120" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="515" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Clustering</text>
  <text x="450" y="115" font-size="11" fill="#334155">no labels (unsupervised)</text>
  <text x="450" y="135" font-size="11" fill="#334155">customer segments</text>
  <text x="450" y="155" font-size="11" fill="#334155">metrics: silhouette</text>
  <rect x="120" y="210" width="180" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="210" y="240" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="600">Supervised (labeled data)</text>
  <rect x="340" y="210" width="180" height="50" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="430" y="240" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="600">Unsupervised (no labels)</text>
  <text x="320" y="310" text-anchor="middle" font-size="12" fill="#475569">Train / Valid / Test split  |  Cross-validation for robust evaluation</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">Binary vs multi-class classification</text>
</svg>
