<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">K-Fold Cross-Validation (k=5)</text>
  <g font-size="11">
    <rect x="60" y="70" width="90" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="105" y="95" text-anchor="middle" fill="#1e40af">fold 1</text>
    <rect x="160" y="70" width="90" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="95" text-anchor="middle" fill="#1e40af">fold 2</text>
    <rect x="260" y="70" width="90" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="305" y="95" text-anchor="middle" fill="#1e40af">fold 3</text>
    <rect x="360" y="70" width="90" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="405" y="95" text-anchor="middle" fill="#1e40af">fold 4</text>
    <rect x="460" y="70" width="90" height="40" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="505" y="95" text-anchor="middle" fill="#1e40af">fold 5</text>
  </g>
  <text x="40" y="150" font-size="12" fill="#64748b">Round 1:</text>
  <rect x="60" y="135" width="90" height="30" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="105" y="155" text-anchor="middle" font-size="10" fill="#991b1b">val</text>
  <rect x="160" y="135" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="260" y="135" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="360" y="135" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="460" y="135" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="40" y="200" font-size="12" fill="#64748b">Round 2:</text>
  <rect x="60" y="185" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="160" y="185" width="90" height="30" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="205" y="205" text-anchor="middle" font-size="10" fill="#991b1b">val</text>
  <rect x="260" y="185" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="360" y="185" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/><rect x="460" y="185" width="90" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="40" y="250" font-size="12" fill="#64748b">...</text>
  <text x="60" y="280" font-size="12" fill="#475569">Each fold serves as validation once; others train the model</text>
  <text x="60" y="300" font-size="12" fill="#475569">Final score = average of k validation scores</text>
  <rect x="400" y="260" width="200" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="500" y="282" text-anchor="middle" font-size="12" fill="#166534" font-weight="600">StratifiedKFold</text>
  <text x="500" y="300" text-anchor="middle" font-size="10" fill="#475569">preserves class ratio</text>
</svg>
