<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">REST API Request Flow</text>
  <rect x="40" y="120" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="90" y="150" text-anchor="middle" font-size="12" fill="#1e40af">Client</text>
  <line x1="140" y1="145" x2="200" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#b)"/>
  <text x="170" y="135" text-anchor="middle" font-size="10" fill="#64748b">HTTP</text>
  <rect x="200" y="100" width="120" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="260" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">API Server</text>
  <text x="260" y="150" text-anchor="middle" font-size="10" fill="#64748b">FastAPI / Flask</text>
  <text x="260" y="168" text-anchor="middle" font-size="10" fill="#64748b">GET / POST</text>
  <line x1="320" y1="145" x2="380" y2="145" stroke="#7c3aed" stroke-width="2" marker-end="url(#b)"/>
  <rect x="380" y="120" width="100" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#166534">Model</text>
  <rect x="40" y="230" width="520" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="255" font-size="12" fill="#334155" font-weight="600">HTTP methods:</text>
  <text x="60" y="278" font-size="11" fill="#475569">GET - read data  |  POST - create / predict  |  PUT - update  |  DELETE - remove</text>
  <text x="60" y="300" font-size="11" fill="#475569">JSON request/response  |  pydantic validation  |  joblib model serialization</text>
  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
</svg>
