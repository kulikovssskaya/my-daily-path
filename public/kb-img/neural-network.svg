<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Neural Network (fully connected)</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="150" y1="110" x2="320" y2="90"/><line x1="150" y1="110" x2="320" y2="170"/><line x1="150" y1="110" x2="320" y2="250"/><line x1="150" y1="110" x2="320" y2="330"/>
    <line x1="150" y1="200" x2="320" y2="90"/><line x1="150" y1="200" x2="320" y2="170"/><line x1="150" y1="200" x2="320" y2="250"/><line x1="150" y1="200" x2="320" y2="330"/>
    <line x1="150" y1="290" x2="320" y2="90"/><line x1="150" y1="290" x2="320" y2="170"/><line x1="150" y1="290" x2="320" y2="250"/><line x1="150" y1="290" x2="320" y2="330"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="320" y1="90" x2="490" y2="160"/><line x1="320" y1="90" x2="490" y2="240"/>
    <line x1="320" y1="170" x2="490" y2="160"/><line x1="320" y1="170" x2="490" y2="240"/>
    <line x1="320" y1="250" x2="490" y2="160"/><line x1="320" y1="250" x2="490" y2="240"/>
    <line x1="320" y1="330" x2="490" y2="160"/><line x1="320" y1="330" x2="490" y2="240"/>
  </g>

  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <circle cx="150" cy="110" r="18"/><circle cx="150" cy="200" r="18"/><circle cx="150" cy="290" r="18"/>
  </g>
  <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
    <circle cx="320" cy="90" r="18"/><circle cx="320" cy="170" r="18"/><circle cx="320" cy="250" r="18"/><circle cx="320" cy="330" r="18"/>
  </g>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
    <circle cx="490" cy="160" r="18"/><circle cx="490" cy="240" r="18"/>
  </g>

  <text x="150" y="345" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="600">Input</text>
  <text x="320" y="375" text-anchor="middle" font-size="13" fill="#6d28d9" font-weight="600">Hidden layers</text>
  <text x="490" y="290" text-anchor="middle" font-size="13" fill="#15803d" font-weight="600">Output</text>

  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#64748b">each edge is a weight; neuron activation a = f(sum(wi*xi) + b)</text>
</svg>
