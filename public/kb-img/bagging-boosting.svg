<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Bagging vs Boosting</text>

  <line x1="320" y1="55" x2="320" y2="380" stroke="#e2e8f0" stroke-width="2"/>

  <text x="160" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">Bagging (parallel)</text>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#64748b">reduces variance, Random Forest</text>

  <rect x="60" y="110" width="200" height="26" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#1e40af">random data subsets</text>

  <rect x="60" y="160" width="56" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="88" y="185" text-anchor="middle" font-size="11" fill="#1e40af">M1</text>
  <rect x="132" y="160" width="56" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="#1e40af">M2</text>
  <rect x="204" y="160" width="56" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="232" y="185" text-anchor="middle" font-size="11" fill="#1e40af">M3</text>

  <line x1="88" y1="200" x2="160" y2="250" stroke="#93c5fd" stroke-width="2"/>
  <line x1="160" y1="200" x2="160" y2="250" stroke="#93c5fd" stroke-width="2"/>
  <line x1="232" y1="200" x2="160" y2="250" stroke="#93c5fd" stroke-width="2"/>

  <rect x="90" y="250" width="140" height="34" rx="8" fill="#2563eb"/>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">average / vote</text>

  <text x="480" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Boosting (sequential)</text>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#64748b">reduces bias, XGBoost</text>

  <rect x="400" y="120" width="72" height="38" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="436" y="144" text-anchor="middle" font-size="11" fill="#991b1b">M1</text>
  <rect x="444" y="180" width="72" height="38" rx="6" fill="#fecaca" stroke="#dc2626"/>
  <text x="480" y="204" text-anchor="middle" font-size="11" fill="#991b1b">M2</text>
  <rect x="488" y="240" width="72" height="38" rx="6" fill="#fca5a5" stroke="#dc2626"/>
  <text x="524" y="264" text-anchor="middle" font-size="11" fill="#7f1d1d">M3</text>

  <path d="M472,150 C500,160 500,170 470,185" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M516,210 C544,220 544,230 514,245" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="556" y="180" font-size="10" fill="#991b1b">fixes</text>
  <text x="556" y="240" font-size="10" fill="#991b1b">errors</text>

  <rect x="410" y="300" width="140" height="34" rx="8" fill="#dc2626"/>
  <text x="480" y="322" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="600">weighted sum</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
