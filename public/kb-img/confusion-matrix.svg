<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Confusion Matrix</text>

  <text x="360" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Predicted</text>
  <text x="270" y="95" text-anchor="middle" font-size="13" fill="#475569">Positive</text>
  <text x="450" y="95" text-anchor="middle" font-size="13" fill="#475569">Negative</text>

  <text x="60" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 60 200)">Actual</text>
  <text x="110" y="165" text-anchor="middle" font-size="13" fill="#475569">Positive</text>
  <text x="110" y="285" text-anchor="middle" font-size="13" fill="#475569">Negative</text>

  <rect x="180" y="110" width="180" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">TP</text>
  <text x="270" y="175" text-anchor="middle" font-size="12" fill="#166534">True Positive</text>

  <rect x="360" y="110" width="180" height="100" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">FN</text>
  <text x="450" y="175" text-anchor="middle" font-size="12" fill="#991b1b">False Negative</text>

  <rect x="180" y="210" width="180" height="100" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">FP</text>
  <text x="270" y="275" text-anchor="middle" font-size="12" fill="#991b1b">False Positive</text>

  <rect x="360" y="210" width="180" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">TN</text>
  <text x="450" y="275" text-anchor="middle" font-size="12" fill="#166534">True Negative</text>

  <text x="320" y="345" text-anchor="middle" font-size="12" fill="#334155">Precision = TP / (TP + FP)     Recall = TP / (TP + FN)</text>
  <text x="320" y="368" text-anchor="middle" font-size="12" fill="#334155">F1 = 2 * Precision * Recall / (Precision + Recall)</text>
</svg>
