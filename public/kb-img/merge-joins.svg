<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Pandas merge: join types</text>
  <g transform="translate(80,70)">
    <circle cx="60" cy="50" r="40" fill="#dbeafe" stroke="#2563eb" opacity="0.8"/>
    <circle cx="100" cy="50" r="40" fill="#dcfce7" stroke="#16a34a" opacity="0.8"/>
    <text x="80" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">inner</text>
    <text x="80" y="135" text-anchor="middle" font-size="10" fill="#64748b">intersection only</text>
  </g>
  <g transform="translate(200,70)">
    <circle cx="60" cy="50" r="40" fill="#dbeafe" stroke="#2563eb" opacity="0.8"/>
    <circle cx="100" cy="50" r="40" fill="#dcfce7" stroke="#16a34a" opacity="0.3"/>
    <text x="80" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">left</text>
    <text x="80" y="135" text-anchor="middle" font-size="10" fill="#64748b">all left rows</text>
  </g>
  <g transform="translate(320,70)">
    <circle cx="60" cy="50" r="40" fill="#dbeafe" stroke="#2563eb" opacity="0.3"/>
    <circle cx="100" cy="50" r="40" fill="#dcfce7" stroke="#16a34a" opacity="0.8"/>
    <text x="80" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">right</text>
    <text x="80" y="135" text-anchor="middle" font-size="10" fill="#64748b">all right rows</text>
  </g>
  <g transform="translate(440,70)">
    <circle cx="60" cy="50" r="40" fill="#dbeafe" stroke="#2563eb" opacity="0.8"/>
    <circle cx="100" cy="50" r="40" fill="#dcfce7" stroke="#16a34a" opacity="0.8"/>
    <text x="80" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">outer</text>
    <text x="80" y="135" text-anchor="middle" font-size="10" fill="#64748b">union of both</text>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#475569">pd.merge(df1, df2, on="key", how="inner|left|right|outer")</text>
  <text x="320" y="255" text-anchor="middle" font-size="11" fill="#64748b">Validate row counts after merge to catch unexpected duplicates</text>
  <rect x="40" y="280" width="560" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="305" font-size="11" fill="#334155">Modern alternatives: pd.concat(axis=0) for stacking rows;</text>
  <text x="60" y="325" font-size="11" fill="#334155">duckdb.sql("SELECT * FROM df1 JOIN df2 USING(key)") for large joins;</text>
  <text x="60" y="345" font-size="11" fill="#334155">Polars: df1.join(df2, on="key", how="inner") for speed on big data.</text>
</svg>
