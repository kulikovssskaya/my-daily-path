<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Hypothesis Testing Flow</text>
  <rect x="220" y="55" width="200" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#1e40af">1. Formulate H0 and H1</text>
  <line x1="320" y1="91" x2="320" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="220" y="115" width="200" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="320" y="138" text-anchor="middle" font-size="12" fill="#5b21b6">2. Choose alpha (e.g. 0.05)</text>
  <line x1="320" y1="151" x2="320" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="175" width="240" height="36" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#92400e">3. Check assumptions (Shapiro, Levene)</text>
  <line x1="320" y1="211" x2="320" y2="235" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="235" width="280" height="36" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="258" text-anchor="middle" font-size="12" fill="#166534">4. Run test (t-test / Mann-Whitney)</text>
  <line x1="320" y1="271" x2="320" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="295" width="240" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#991b1b">5. Compare p-value vs alpha</text>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#7f1d1d">p &lt; alpha: reject H0  |  p &gt;= alpha: fail to reject</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
  <text x="520" y="200" font-size="11" fill="#64748b">H0: no difference</text>
  <text x="520" y="218" font-size="11" fill="#64748b">H1: difference exists</text>
</svg>
