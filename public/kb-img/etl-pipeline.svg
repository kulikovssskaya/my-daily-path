<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ETL Pipeline</text>
  <rect x="40" y="100" width="120" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="100" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Extract</text>
  <text x="100" y="145" text-anchor="middle" font-size="10" fill="#475569">sources: DB, API, files</text>
  <line x1="160" y1="130" x2="220" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#d)"/>
  <rect x="220" y="100" width="120" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Transform</text>
  <text x="280" y="145" text-anchor="middle" font-size="10" fill="#475569">clean, join, aggregate</text>
  <line x1="340" y1="130" x2="400" y2="130" stroke="#7c3aed" stroke-width="2" marker-end="url(#d)"/>
  <rect x="400" y="100" width="120" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Load</text>
  <text x="460" y="145" text-anchor="middle" font-size="10" fill="#475569">warehouse / lake</text>
  <rect x="40" y="210" width="250" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="235" font-size="12" fill="#334155" font-weight="600">Data Lake</text>
  <text x="60" y="255" font-size="11" fill="#475569">raw, unstructured, cheap storage</text>
  <text x="60" y="275" font-size="11" fill="#475569">schema-on-read</text>
  <text x="60" y="295" font-size="11" fill="#475569">e.g. S3, HDFS</text>
  <rect x="350" y="210" width="250" height="110" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="370" y="235" font-size="12" fill="#334155" font-weight="600">Data Warehouse</text>
  <text x="370" y="255" font-size="11" fill="#475569">structured, curated, fast queries</text>
  <text x="370" y="275" font-size="11" fill="#475569">schema-on-write</text>
  <text x="370" y="295" font-size="11" fill="#475569">e.g. Snowflake, BigQuery</text>
  <defs><marker id="d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
</svg>
