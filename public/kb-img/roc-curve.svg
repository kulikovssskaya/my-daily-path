<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ROC Curve and AUC</text>

  <rect x="120" y="70" width="260" height="260" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="120" y1="330" x2="380" y2="70" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="250" y="215" font-size="11" fill="#64748b" transform="rotate(-45 250 215)">random classifier</text>

  <path d="M120,330 C150,180 230,110 380,70 L380,330 Z" fill="#dbeafe" opacity="0.6"/>
  <path d="M120,330 C150,180 230,110 380,70" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <text x="250" y="150" font-size="13" fill="#1e40af" font-weight="700">AUC</text>

  <text x="250" y="358" text-anchor="middle" font-size="13" fill="#475569">FPR = 1 - Specificity</text>
  <text x="95" y="200" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 95 200)">TPR = Recall</text>
  <text x="118" y="345" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <text x="380" y="345" text-anchor="middle" font-size="10" fill="#64748b">1</text>

  <text x="420" y="120" font-size="12" fill="#334155" font-weight="700">How to read:</text>
  <text x="420" y="145" font-size="12" fill="#475569">AUC = 1.0  -&gt; perfect</text>
  <text x="420" y="168" font-size="12" fill="#475569">AUC = 0.5  -&gt; random</text>
  <text x="420" y="196" font-size="12" fill="#475569">Closer to the top-left</text>
  <text x="420" y="214" font-size="12" fill="#475569">corner is better</text>
  <text x="420" y="248" font-size="12" fill="#475569">Robust to imbalance,</text>
  <text x="420" y="266" font-size="12" fill="#475569">threshold-independent</text>
</svg>
