<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Stack vs Queue</text>
  <line x1="320" y1="55" x2="320" y2="330" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">Stack (LIFO)</text>
  <text x="160" y="88" text-anchor="middle" font-size="11" fill="#64748b">Last In, First Out</text>
  <rect x="110" y="110" width="100" height="36" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="160" y="133" text-anchor="middle" font-size="12" fill="#1e40af">push/pop top</text>
  <rect x="110" y="155" width="100" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#475569">item 3</text>
  <rect x="110" y="200" width="100" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="160" y="223" text-anchor="middle" font-size="12" fill="#475569">item 2</text>
  <rect x="110" y="245" width="100" height="36" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="160" y="268" text-anchor="middle" font-size="12" fill="#475569">item 1</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Queue (FIFO)</text>
  <text x="480" y="88" text-anchor="middle" font-size="11" fill="#64748b">First In, First Out</text>
  <text x="380" y="200" font-size="11" fill="#64748b">enqueue --&gt;</text>
  <rect x="410" y="180" width="70" height="40" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="445" y="205" text-anchor="middle" font-size="12" fill="#991b1b">1st</text>
  <rect x="490" y="180" width="70" height="40" rx="4" fill="#fecaca" stroke="#f87171"/>
  <text x="525" y="205" text-anchor="middle" font-size="12" fill="#7f1d1d">2nd</text>
  <rect x="570" y="180" width="50" height="40" rx="4" fill="#fca5a5" stroke="#ef4444"/>
  <text x="595" y="205" text-anchor="middle" font-size="12" fill="#7f1d1d">3rd</text>
  <text x="560" y="250" font-size="11" fill="#64748b">--&gt; dequeue</text>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#475569">Big-O: push/pop O(1)  |  enqueue/dequeue O(1) with deque</text>
</svg>
