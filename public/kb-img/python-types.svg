<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Python Data Structures</text>
  <rect x="240" y="55" width="160" height="32" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Collections</text>
  <rect x="60" y="120" width="110" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="115" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">list</text>
  <text x="115" y="158" text-anchor="middle" font-size="10" fill="#475569">ordered, mutable</text>
  <rect x="190" y="120" width="110" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="245" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">tuple</text>
  <text x="245" y="158" text-anchor="middle" font-size="10" fill="#475569">ordered, immutable</text>
  <rect x="320" y="120" width="110" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="375" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">set</text>
  <text x="375" y="158" text-anchor="middle" font-size="10" fill="#475569">unique, unordered</text>
  <rect x="450" y="120" width="130" height="50" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="515" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">dict</text>
  <text x="515" y="158" text-anchor="middle" font-size="10" fill="#475569">key-value pairs</text>
  <rect x="120" y="220" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="190" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">int, float</text>
  <text x="190" y="258" text-anchor="middle" font-size="10" fill="#475569">numeric types</text>
  <rect x="290" y="220" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="360" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">str</text>
  <text x="360" y="258" text-anchor="middle" font-size="10" fill="#475569">text sequences</text>
  <rect x="460" y="220" width="140" height="50" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="530" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">bool</text>
  <text x="530" y="258" text-anchor="middle" font-size="10" fill="#475569">True / False</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#64748b">Everything in Python is an object</text>
</svg>
