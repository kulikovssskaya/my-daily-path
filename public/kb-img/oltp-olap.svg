<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">OLTP vs OLAP</text>
  <line x1="320" y1="55" x2="320" y2="320" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">OLTP</text>
  <text x="160" y="95" text-anchor="middle" font-size="11" fill="#64748b">Online Transaction Processing</text>
  <text x="40" y="130" font-size="12" fill="#334155">- many short transactions</text>
  <text x="40" y="155" font-size="12" fill="#334155">- INSERT / UPDATE / DELETE</text>
  <text x="40" y="180" font-size="12" fill="#334155">- normalized schema (3NF)</text>
  <text x="40" y="205" font-size="12" fill="#334155">- row-oriented storage</text>
  <text x="40" y="230" font-size="12" fill="#334155">- e.g. banking, e-commerce</text>
  <rect x="60" y="250" width="200" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="160" y="280" text-anchor="middle" font-size="12" fill="#1e40af">operational DB</text>
  <text x="480" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">OLAP</text>
  <text x="480" y="95" text-anchor="middle" font-size="11" fill="#64748b">Online Analytical Processing</text>
  <text x="340" y="130" font-size="12" fill="#334155">- complex analytical queries</text>
  <text x="340" y="155" font-size="12" fill="#334155">- SELECT with aggregations</text>
  <text x="340" y="180" font-size="12" fill="#334155">- star / snowflake schema</text>
  <text x="340" y="205" font-size="12" fill="#334155">- column-oriented storage</text>
  <text x="340" y="230" font-size="12" fill="#334155">- e.g. BI dashboards, reports</text>
  <rect x="380" y="250" width="200" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="480" y="280" text-anchor="middle" font-size="12" fill="#991b1b">data warehouse</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#64748b">ETL connects OLTP to OLAP</text>
</svg>
