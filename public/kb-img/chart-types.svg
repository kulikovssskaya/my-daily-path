<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Chart Selection Guide</text>
  <rect x="40" y="55" width="260" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="170" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Categorical data</text>
  <text x="60" y="110" font-size="12" fill="#334155">bar chart - compare groups</text>
  <text x="60" y="135" font-size="12" fill="#334155">pie chart - parts of whole (2 groups)</text>
  <text x="60" y="160" font-size="12" fill="#334155">count plot - frequency</text>
  <rect x="340" y="55" width="260" height="150" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="470" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Numeric data</text>
  <text x="360" y="110" font-size="12" fill="#334155">histogram - distribution</text>
  <text x="360" y="135" font-size="12" fill="#334155">box plot - outliers, quartiles</text>
  <text x="360" y="160" font-size="12" fill="#334155">line plot - trends over time</text>
  <rect x="40" y="230" width="260" height="150" rx="10" fill="#fdf4ff" stroke="#d8b4fe"/>
  <text x="170" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Relationships</text>
  <text x="60" y="285" font-size="12" fill="#334155">scatter plot - two variables</text>
  <text x="60" y="310" font-size="12" fill="#334155">heatmap - correlation matrix</text>
  <text x="60" y="335" font-size="12" fill="#334155">pairplot - all pairs</text>
  <rect x="340" y="230" width="260" height="150" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="470" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Best practice</text>
  <text x="360" y="285" font-size="12" fill="#334155">KISS - keep it simple</text>
  <text x="360" y="310" font-size="12" fill="#334155">label axes and title</text>
  <text x="360" y="335" font-size="12" fill="#334155">avoid pie for 3+ categories</text>
</svg>
