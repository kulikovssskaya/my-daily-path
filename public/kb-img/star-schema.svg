<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Star Schema (Data Warehouse)</text>
  <rect x="260" y="160" width="120" height="50" rx="8" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">FACT</text>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#92400e">sales_amount</text>
  <rect x="80" y="70" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="95" text-anchor="middle" font-size="11" fill="#1e40af">dim_date</text>
  <rect x="460" y="70" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="510" y="95" text-anchor="middle" font-size="11" fill="#1e40af">dim_product</text>
  <rect x="80" y="260" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="285" text-anchor="middle" font-size="11" fill="#1e40af">dim_customer</text>
  <rect x="460" y="260" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="510" y="285" text-anchor="middle" font-size="11" fill="#1e40af">dim_store</text>
  <line x1="180" y1="90" x2="260" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="90" x2="380" y2="175" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="280" x2="260" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <line x1="460" y1="280" x2="380" y2="195" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#475569">Fact table = measures  |  Dimension tables = descriptive attributes</text>
  <text x="320" y="370" text-anchor="middle" font-size="11" fill="#94a3b8">Snowflake = normalized dimensions  |  Star = denormalized (faster queries)</text>
</svg>
