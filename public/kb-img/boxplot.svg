<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Box Plot Anatomy</text>
  <line x1="320" y1="60" x2="320" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="200" y1="80" x2="440" y2="80" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="84" font-size="11" fill="#64748b">max (whisker)</text>
  <rect x="240" y="130" width="160" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="155" font-size="11" fill="#64748b">Q3 (75th pct)</text>
  <line x1="240" y1="195" x2="400" y2="195" stroke="#dc2626" stroke-width="3"/>
  <text x="460" y="199" font-size="11" fill="#dc2626" font-weight="600">median</text>
  <text x="460" y="235" font-size="11" fill="#64748b">Q1 (25th pct)</text>
  <line x1="200" y1="280" x2="440" y2="280" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="284" font-size="11" fill="#64748b">min (whisker)</text>
  <circle cx="180" cy="70" r="6" fill="#f97316" stroke="#ea580c"/>
  <text x="100" y="74" font-size="11" fill="#ea580c">outlier</text>
  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#475569">IQR = Q3 - Q1  |  whiskers: 1.5 * IQR from box</text>
</svg>
