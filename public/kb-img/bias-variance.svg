<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Bias-Variance Tradeoff</text>

  <line x1="80" y1="330" x2="600" y2="330" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="70" stroke="#94a3b8" stroke-width="2"/>
  <text x="340" y="368" text-anchor="middle" font-size="13" fill="#475569">Model complexity --&gt;</text>
  <text x="30" y="200" text-anchor="middle" font-size="13" fill="#475569" transform="rotate(-90 30 200)">Error --&gt;</text>

  <path d="M80,110 C200,180 320,290 600,318" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="140" y="105" font-size="13" fill="#2563eb" font-weight="600">Bias^2</text>

  <path d="M80,320 C320,300 440,200 600,90" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="510" y="80" font-size="13" fill="#dc2626" font-weight="600">Variance</text>

  <path d="M80,180 C220,120 300,120 340,150 C420,205 500,150 600,120" fill="none" stroke="#059669" stroke-width="3.5"/>
  <text x="360" y="128" font-size="13" fill="#059669" font-weight="700">Total error</text>

  <line x1="330" y1="150" x2="330" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="330" cy="150" r="6" fill="#059669"/>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">optimum</text>

  <text x="150" y="325" text-anchor="middle" font-size="11" fill="#64748b">underfit</text>
  <text x="540" y="325" text-anchor="middle" font-size="11" fill="#64748b">overfit</text>
</svg>
