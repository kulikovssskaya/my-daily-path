<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="640" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Decision Tree</text>
  <circle cx="320" cy="80" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#1e40af">age &gt; 30?</text>
  <text x="320" y="90" text-anchor="middle" font-size="9" fill="#64748b">root node</text>
  <line x1="300" y1="105" x2="180" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="105" x2="460" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <text x="230" y="140" font-size="10" fill="#16a34a">Yes</text>
  <text x="400" y="140" font-size="10" fill="#dc2626">No</text>
  <circle cx="180" cy="185" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" font-size="10" fill="#5b21b6">salary &gt; 50k?</text>
  <circle cx="460" cy="185" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="182" text-anchor="middle" font-size="10" fill="#5b21b6">city = Moscow?</text>
  <line x1="165" y1="210" x2="100" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="195" y1="210" x2="260" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="445" y1="210" x2="380" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="475" y1="210" x2="540" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="280" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="100" y="303" text-anchor="middle" font-size="11" fill="#166534">Buy</text>
  <rect x="220" y="280" width="80" height="36" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#991b1b">Skip</text>
  <rect x="340" y="280" width="80" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="303" text-anchor="middle" font-size="11" fill="#166534">Buy</text>
  <rect x="500" y="280" width="80" height="36" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="540" y="303" text-anchor="middle" font-size="11" fill="#991b1b">Skip</text>
  <text x="100" y="340" text-anchor="middle" font-size="10" fill="#64748b">leaf</text>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#475569">Split criteria: Gini impurity or Entropy  |  max_depth controls overfitting</text>
</svg>
